name: AMAN_PROFILE_UPDATOR_WORKFLOW

on:
  schedule:
    - cron: '29 3 * * *'   
    - cron: '29 5 * * *'   # 10:13 AM
    - cron: '29 7 * * *'   # 12:13 PM
    - cron: '29 9 * * *'   # 2:13 PM
    - cron: '29 11 * * *'  # 4:13 PM
    - cron: '29 13 * * *'  # 6:13 PM
    - cron: '29 15 * * *'  # 8:13 PM
    - cron: '29 17 * * *'  # 10:13 PM
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: naukri-ec2
    permissions:
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary via AI
        id: ai_summary
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Write a professional Naukri profile summary for a Software Development Engineer.
            Keep it between 80 and 120 words stricly. Plain paragraph text only — no bullet points, no markdown, no special characters.

            Candidate profile:
            Software Development Engineer at Philips Healthcare with 3 years of experience building scalable backend systems for medical device fleet management.
            Currently working on a cloud-based IoT platform that enables centralized monitoring and configuration management of 100+ MRI scanners deployed across hospitals — replacing manual field engineer interventions with automated, event-driven microservices.
            My day-to-day involves:
            • Designing and building Java/Spring Boot microservices with event-driven architecture (Kafka)
            • Implementing real-time monitoring systems with Redis, WebSocket, and custom alerting
            • Working with AWS cloud services (EKS, RDS, ElastiCache, S3) for production deployments
            • Writing clean, tested code with 85%+ coverage (JUnit 5, Mockito, Testcontainers)
            • Collaborating in cross-functional Agile teams on architecture decisions and code reviews
            Tech Stack: Java | Spring Boot 3.x | Apache Kafka | Redis | PostgreSQL | Docker | Kubernetes | AWS | GitHub Actions

            Write in first person, confident tone. Start with the role/experience line. End with what kind of opportunity they are seeking.

      - name: Validate and fallback summary
        id: final_summary
        run: |
          SUMMARY="${{ steps.ai_summary.outputs.response }}"
          WORD_COUNT=$(echo "$SUMMARY" | wc -w)
          echo "Word count: $WORD_COUNT"

          if [ "$WORD_COUNT" -lt 50 ] || [ "$WORD_COUNT" -gt 800 ]; then
            echo "AI summary out of range ($WORD_COUNT words), using fallback."
            SUMMARY="Software Development Engineer with 3 years of experience at Philips, building scalable cloud-native applications and backend systems. Experienced in developing REST APIs, microservices architecture, and improving system performance through caching and query optimization. Proficient in Java, Spring Boot, Node.js, and TypeScript, with hands-on experience in AWS, Kubernetes, Docker, and CI/CD pipelines. Strong understanding of distributed systems and observability using OpenTelemetry, Prometheus, and Grafana. Published an npm plugin and contributed to a 10K-star open source project. Currently seeking backend or full stack SDE roles to build high-impact systems."
          fi

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload resume to Naukri
        uses: Prateek-Wayne/naukri-resume-action@v1.2.0
        with:
          username: ${{ secrets.AMAN_NAUKRI_EMAIL }}
          password: ${{ secrets.AMAN_NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.AMAN_PROFILE_ID }}
          resume_path: ./resumes/AmanChoudharyResume.pdf
          profile_summary: ${{ steps.final_summary.outputs.summary }}
