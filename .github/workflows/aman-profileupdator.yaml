name: AMAN_PROFILE_UPDATOR_WORKFLOW

on:
  schedule:
    - cron: '29 3 * * *'   
    - cron: '29 5 * * *'   # 10:13 AM
    - cron: '29 7 * * *'   # 12:13 PM
    - cron: '29 9 * * *'   # 2:13 PM
    - cron: '29 11 * * *'  # 4:13 PM
    - cron: '29 13 * * *'  # 6:13 PM
    - cron: '29 15 * * *'  # 8:13 PM
    - cron: '29 17 * * *'  # 10:13 PM
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: naukri-ec2
    permissions:
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary via AI
        id: ai_summary
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Write a professional Naukri profile summary for a Software Development Engineer.
            Keep it between 80 and 120 words strictly. Plain paragraph text only — no bullet points, no markdown, no special characters.

            Candidate profile:
            - Name: Aman Choudhary
            - Role: Software Development Engineer at Philips Healthcare, 3 years experience
            - Education: B.Tech in Computer Science from Lovely Professional University (CGPA 8.08/10)
            - Current work: Building cloud-based fleet management platform for centralized monitoring and configuration of 100+ MRI scanners across hospitals
            - Key achievements:
              • Owned Config Transfer Service — designed config export/import pipeline using Strategy Pattern for 8+ file types, reducing field engineer intervention by 60%
              • Built Fleet Health Service with real-time heartbeat monitoring via WebSocket (STOMP) and Redis TTL-based offline detection
              • Designed event-driven architecture using Apache Kafka with idempotent producers and Dead Letter Topics
              • Reduced API response time from 120ms to 15ms using Redis caching for session validation and machine metadata
              • Implemented Spring Security + JWT with role-based access and HIPAA-compliant audit logging
              • Containerized services with Docker, deployed on AWS EKS with Helm charts and HPA auto-scaling
              • Set up observability with Micrometer + Prometheus + Grafana dashboards
            - As intern: Built automated MRI scanner deployment framework reducing manual setup time by 70% across 50+ hospitals, implemented multi-threaded parallel processing improving throughput by 50%
            - Backend: Java, Spring Boot, Spring MVC, Spring Data JPA, Spring Security (JWT/OAuth2), Hibernate, MapStruct, WebSocket (STOMP)
            - Databases: PostgreSQL, Redis (ElastiCache), Flyway Migrations
            - Messaging: Apache Kafka, Event-Driven Architecture, Strategy Pattern, Saga (Choreography)
            - Cloud & DevOps: AWS (EKS, RDS, ElastiCache, S3, CloudWatch, IAM), Docker, Kubernetes, Helm, GitHub Actions, SonarQube
            - Observability: Micrometer, Prometheus, Grafana, Structured JSON Logging
            - Looking for: Backend or Full Stack SDE roles in distributed systems, cloud-native platforms, or IoT

            Write in first person, confident tone. Start with the role/experience line. End with what kind of opportunity they are seeking.

      - name: Validate and fallback summary
        id: final_summary
        run: |
          SUMMARY="${{ steps.ai_summary.outputs.response }}"
          WORD_COUNT=$(echo "$SUMMARY" | wc -w)
          echo "Word count: $WORD_COUNT"

          if [ "$WORD_COUNT" -lt 50 ] || [ "$WORD_COUNT" -gt 800 ]; then
            echo "AI summary out of range ($WORD_COUNT words), using fallback."
            SUMMARY="Software Development Engineer with 3 years of experience at Philips Healthcare, building scalable backend services for medical device fleet management. Proficient in Java and Spring Boot microservices with event-driven architecture using Apache Kafka. Currently building a cloud-based fleet management platform for centralized monitoring of 100+ MRI scanners across hospitals. Experienced in Redis caching, WebSocket real-time monitoring, Spring Security with JWT, and HIPAA-compliant audit logging. Skilled in containerized deployments on AWS EKS with Docker, Kubernetes, and Helm. Strong focus on observability using Prometheus and Grafana. Seeking backend or full stack SDE roles in distributed systems and cloud-native platforms."
          fi

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate resume headline via AI
        id: ai_headline
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Write a professional Naukri resume headline for a Software Development Engineer.
            It must be a single line, maximum 250 characters, no special characters or quotes.
            Candidate profile:
            - Title: Software Development Engineer at Philips Healthcare, 3 years experience
            - Backend: Java, Spring Boot, Spring Security, Hibernate, JPA, WebSocket
            - Messaging: Apache Kafka, Event-Driven Architecture
            - Databases: PostgreSQL, Redis
            - Cloud & DevOps: AWS (EKS, RDS, ElastiCache, S3), Docker, Kubernetes, Helm, GitHub Actions
            - Observability: Prometheus, Grafana, Micrometer
            - Domain: Healthcare IoT platform, MRI scanner fleet management, HIPAA-compliant systems
            - Key highlights: Reduced API latency from 120ms to 15ms, reduced field engineer intervention by 60%, 85%+ code coverage
            Write a concise, keyword-rich headline that recruiters search for. Vary the format each time. Example formats:
            "SDE | Java | Spring Boot | Kafka | AWS | Microservices | 3 Years"
            "Backend Engineer | Java Spring Boot | Kafka | Redis | AWS EKS | Healthcare IoT"

      - name: Validate and fallback headline
        id: final_headline
        env:
          HEADLINE: ${{ steps.ai_headline.outputs.response }}
        run: |
          CHAR_COUNT=${#HEADLINE}
          echo "Character count: $CHAR_COUNT"

          if [ "$CHAR_COUNT" -lt 10 ] || [ "$CHAR_COUNT" -gt 250 ]; then
            echo "AI headline out of range ($CHAR_COUNT chars), using fallback."
            HEADLINE="Software Development Engineer | Java | Spring Boot | Kafka | Redis | AWS EKS | Kubernetes | Docker | PostgreSQL | Healthcare IoT | 3 Years"
          fi

          echo "headline<<EOF" >> $GITHUB_OUTPUT
          echo "$HEADLINE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload resume to Naukri
        uses: Prateek-Wayne/naukri-resume-action@v1.3.1
        with:
          username: ${{ secrets.AMAN_NAUKRI_EMAIL }}
          password: ${{ secrets.AMAN_NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.AMAN_PROFILE_ID }}
          resume_path: ./resumes/AmanChoudharyResume.pdf
          profile_summary: ${{ steps.final_summary.outputs.summary }}
          resume_headline: ${{ steps.final_headline.outputs.headline }}
