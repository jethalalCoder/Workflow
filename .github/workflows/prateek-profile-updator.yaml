name: PRATEEK_RESUME_UPDATOR

on:
  schedule:
    # GitHub cron runs in UTC. Times noted are IST equivalents (UTC + 5:30),
    # spread across peak recruiter hours so the profile stays fresh through the day.
    - cron: '0 4 * * *' # 09:30 IST
    - cron: '30 6 * * *' # 12:00 IST
    - cron: '0 9 * * *' # 14:30 IST
    - cron: '30 11 * * *' # 17:00 IST
    - cron: '30 13 * * *' # 19:00 IST
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: naukri-ec2
    permissions:
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary via AI
        id: ai_summary
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Write a professional Naukri profile summary for a Software Development Engineer.
            Keep it between 80 and 120 words (including spaces). Plain paragraph text only — no bullet points, no markdown, no special characters.
            Naturally weave in the most in-demand skills (Java, Spring Boot, Microservices, REST APIs, AWS, Kubernetes, Kafka) so the profile matches more recruiter searches.
            You MUST include at least one specific metric achievement. Avoid generic phrases like "passionate", "innovative", or "complex challenges".
            Rotate focus each time — sometimes emphasize backend, sometimes full stack, sometimes developer platform engineering.
            Do NOT mention any industry or domain terms — no healthcare, hospital, medical, ultrasound, diagnostic, clinical, equipment, or fleet. This is a pure software engineering profile: focus only on software skills, systems, and measurable technical impact.

            Candidate profile:
            - Title: Software Development Engineer II at Philips, 3+ years experience
            - Domain: enterprise cloud-native SaaS platform and Backstage internal developer portal
            - Backend: Java, Spring Boot, Node.js, Express.js, TypeScript, Kafka, Redis, PostgreSQL, MongoDB, Java EE, JVM
            - Frontend: React.js, Micro Frontends (Module Federation), Webpack, Vite
            - Cloud & Infra: AWS (EKS, ECR, S3, Secrets Manager), Kubernetes, Docker, Helm, Crossplane
            - Observability: OpenTelemetry, Prometheus, Grafana, AWS CloudWatch, Distributed Tracing
            - CI/CD: GitHub Actions
            - Strengths: REST APIs, microservices, developer platform engineering, search indexing pipelines, self-serve automation, caching, query optimization, distributed systems
            - Key achievements: Took end-to-end ownership of deployment infrastructure (Kubernetes, Helm, CI/CD) for a cloud-native SaaS platform; designed real-time session management using WebSocket keep-alive/heartbeat with automatic idle-logout detection; built internal network onboarding automation reducing effort by 95% across 1,000+ services; built org-wide, search-backend-agnostic Confluence search plugin via Backstage; architected observability platform cutting production diagnosis time from hours to minutes
            - Certifications: AWS Certified Cloud Practitioner
            - Open source: published npm Backstage plugin, contributor to 10K-star project (JSONCrack), LeetCode Top 15%
            - Looking for: backend, full stack, or developer platform SDE roles
          model: openai/gpt-oss-120b
          endpoint: https://api.groq.com/openai/v1
          token: ${{ secrets.GROQ_API_SECRET }}
          max-tokens: 500

      - name: Validate and fallback summary
        id: final_summary
        run: |
          SUMMARY="${{ steps.ai_summary.outputs.response }}"
          WORD_COUNT=$(echo "$SUMMARY" | wc -w)
          echo "Word count: $WORD_COUNT"

          # Reject medical/domain keywords that misclassify the profile in Naukri recruiter search.
          BANNED='ultrasound|medical|hospital|diagnostic|healthcare|clinical|fleet'

          if [ "$WORD_COUNT" -lt 50 ] || [ "$WORD_COUNT" -gt 800 ] || echo "$SUMMARY" | grep -iqE "$BANNED"; then
            echo "AI summary invalid (out of range or banned keyword), using fallback."
            SUMMARY="Software Development Engineer II with 3+ years of experience at Philips, building scalable cloud-native applications and backend systems. Experienced in developing REST APIs, microservices architecture, and improving system performance through caching and query optimization. Proficient in Java, Spring Boot, Node.js, and TypeScript, with hands-on experience in AWS, Kubernetes, Docker, and CI/CD pipelines. Strong understanding of distributed systems and observability using OpenTelemetry, Prometheus, and Grafana. Published an npm plugin and contributed to a 10K-star open source project. Currently seeking backend or full stack SDE roles to build high-impact systems."
          fi

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate resume headline via AI
        id: ai_headline
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Write a professional Naukri resume headline for a Software Development Engineer.
            It must be a single line, maximum 250 characters, no special characters, no quotes, no markdown.
            Always keep these core keywords in every headline: Java, Spring Boot, Microservices, AWS, Kubernetes.
            You may rotate only the trailing/secondary emphasis (e.g. React, Node.js, Backstage, Kafka) — never drop the core keywords.
            Do NOT mention any industry or domain terms — no healthcare, hospital, medical, ultrasound, diagnostic, clinical, equipment, or fleet.

            Candidate profile:
            - Title: Software Development Engineer II at Philips, 3+ years experience
            - Backend: Java, Spring Boot, Node.js, Express.js, Kafka, Redis, PostgreSQL, MongoDB, JVM, Java EE
            - Frontend: React.js, TypeScript, Micro Frontends
            - Cloud & Infra: AWS (EKS, S3, Secrets Manager), Kubernetes, Docker, Helm
            - Observability: OpenTelemetry, Prometheus, Grafana, AWS CloudWatch
            - Platform: Backstage, search indexing pipelines, self-serve developer automation
            - Certifications: AWS Certified Cloud Practitioner
            - Strengths: Microservices, distributed systems, REST APIs, developer platform engineering

            Format: "Role | Skill | Skill | Skill | Skill | Experience"
            Example: "SDE II | Java | Spring Boot | Backstage | AWS | 3+ Years"
            Return only the headline, nothing else.
          model: openai/gpt-oss-120b
          endpoint: https://api.groq.com/openai/v1
          token: ${{ secrets.GROQ_API_SECRET }}

      - name: Validate and fallback headline
        id: final_headline
        env:
          HEADLINE: ${{ steps.ai_headline.outputs.response }}
        run: |
          CHAR_COUNT=${#HEADLINE}
          echo "Character count: $CHAR_COUNT"

          # Reject medical/domain keywords that misclassify the profile in Naukri recruiter search.
          BANNED='ultrasound|medical|hospital|diagnostic|healthcare|clinical|fleet'

          if [ "$CHAR_COUNT" -lt 10 ] || [ "$CHAR_COUNT" -gt 250 ] || echo "$HEADLINE" | grep -iqE "$BANNED"; then
            echo "AI headline invalid (out of range or banned keyword), using fallback."
            HEADLINE="Software Development Engineer II | Java | Spring Boot | Kafka | AWS | Kubernetes | Microservices | 3+ Years"
          fi

          echo "headline<<EOF" >> $GITHUB_OUTPUT
          echo "$HEADLINE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload resume to Naukri
        uses: Prateek-Wayne/naukri-resume-action@v1.3.1
        with:
          username: ${{ secrets.NAUKRI_USERNAME_MAIN }}
          password: ${{ secrets.NAUKRI_PASSWORD_MAIN }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID_MAIN }}
          resume_path: ./resumes/PRATEEK_RESUME.pdf
          profile_summary: ${{ steps.final_summary.outputs.summary }}
          resume_headline: ${{ steps.final_headline.outputs.headline }}
